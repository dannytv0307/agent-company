# ─────────────────────────────────────────────────────────────
#  Agent Company — single source of truth.
#  One organizer leads every project. Each project's team lives in its own repo
#  (.claude/agents/*.md); the organizer proposes new agents and you approve them.
#  Maintained by the app (owner profile, organizer, projects). Hand edits are fine too.
# ─────────────────────────────────────────────────────────────

company:
  name: { en: "My Company", ja: "マイカンパニー" }
  projects:
    - { id: main, name: Main, path: ./workspace }
  activeProject: main
  mission: ""
  rules: |
    - Work only inside the current project directory.
    - Keep outputs concrete and reviewable: files, drafts, checklists, numbers.
    - Reports to your manager are short: what you did, files touched, open issues (max 6 lines).

owner:
  id: owner
  name: { en: "Owner", ja: "オーナー" }
  title: { en: "Owner · Final decisions", ja: "オーナー・最終決定" }
  avatar: "O"
  bio: ""
  preferences:
    approval: manual
    reportLanguage: English

divisions:
  - id: claude
    runtime: claude
    label: { en: "Claude Code", ja: "Claude Code" }
    color: "#38bdf8"
    permissions:
      mode: acceptEdits
      allow:
        - "Bash(npm *)"
        - "Bash(npx *)"
        - "Bash(node *)"
        - "Bash(git status*)"
        - "Bash(git diff*)"
        - "mcp__agent-company"
    ceo:
      id: organizer
      core: true
      name: { en: "Organizer", ja: "オーガナイザー" }
      role: { en: "Organizer", ja: "オーガナイザー" }
      avatar: "O"
      color: "#38bdf8"
      model: opus
      description: "Organizer. Leads every project: plans the work, builds each project's team of agents, delegates and reports."
      prompt: |
        You never do specialist work yourself when a team member fits it.
        Your value is planning, building the right team for each project, delegating, integrating and reporting.
    departments: []
