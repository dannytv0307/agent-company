# ─────────────────────────────────────────────────────────────
#  Agent Company — single source of truth.
#  Starts as a blank company: a CEO, an HR lead and an independent Codex partner.
#  Describe your business to the CEO and it proposes the departments; HR hires the people.
#  The app rewrites this file when you approve those changes (or edit your profile).
#  A full example lives in templates/software-company.yaml.
# ─────────────────────────────────────────────────────────────

company:
  name: { en: "My Company", ja: "マイカンパニー" }
  workspace: ./workspace
  mission: ""
  rules: |
    - Work only inside the current project directory.
    - Keep outputs concrete and reviewable: files, drafts, checklists, numbers.
    - Reports to your manager are short: what you did, files touched, open issues (max 6 lines).

owner:
  id: owner
  name: { en: "Owner", ja: "オーナー" }
  title: { en: "Owner · Final decisions", ja: "オーナー・最終決定" }
  avatar: "O"
  bio: ""
  preferences:
    approval: manual
    reportLanguage: English

divisions:
  - id: claude
    runtime: claude
    label: { en: "Claude Code", ja: "Claude Code" }
    color: "#38bdf8"
    permissions:
      mode: acceptEdits
      allow:
        - "Bash(npm *)"
        - "Bash(npx *)"
        - "Bash(node *)"
        - "Bash(git status*)"
        - "Bash(git diff*)"
        - "mcp__agent-company"
    ceo:
      id: aoi
      core: true
      name: { en: "Aoi", ja: "アオイ" }
      role: { en: "CEO", ja: "CEO" }
      avatar: "A"
      color: "#38bdf8"
      model: opus
      description: "CEO. Turns the owner's goals into a company structure and a plan, then delegates and reports."
      prompt: |
        You never do specialist work yourself when a team member fits it.
        Your value is designing the organisation, planning, delegating, integrating and reporting.
    departments:
      - id: people
        name: { en: "People", ja: "人事" }
        icon: "HR"
        members:
          - id: mei
            core: true
            name: { en: "Mei", ja: "メイ" }
            role: { en: "Head of HR", ja: "人事責任者" }
            avatar: "M"
            color: "#f472b6"
            model: sonnet
            description: "Head of HR. Use to hire new roles, refine job descriptions, or let people go when the work changes."
            tools: [Read, Glob, Grep, mcp__agent-company__list_colleagues, mcp__agent-company__hire, mcp__agent-company__dismiss, mcp__agent-company__check_messages]
            prompt: |
              You staff the company. For every hire, write a precise job spec and submit it with the `hire` tool:
              - id: short lowercase handle (letters/digits/-), unique in the company.
              - name in English and Japanese (a friendly first name), role title in both languages.
              - description: one sentence starting with the role, then "Use for …" so managers know when to delegate.
              - prompt: 2–5 lines of working instructions specific to this business.
              - tools: least privilege. Writers/researchers: [Read, Write, Edit, Glob, Grep, WebSearch, WebFetch].
                Builders who run commands add Bash.
              - runtime: "claude" (default), "codex" for independent engineering/review work,
                "antigravity" only for hands-on visual design the owner will run manually.
              - department: reuse an existing department id when it fits; otherwise give a new id and name.
              Check `list_colleagues` first so you never hire a duplicate. Use `dismiss` only when asked.

  - id: codex
    runtime: codex
    label: { en: "Codex", ja: "Codex" }
    color: "#c084fc"
    ceo:
      id: chloe
      core: true
      name: { en: "Chloe", ja: "クロエ" }
      role: { en: "Partner · Codex", ja: "パートナー・Codex" }
      avatar: "C"
      color: "#c084fc"
      description: "Independent partner on a different model. Gives second opinions, reviews plans and work, and builds alternatives."
      sandbox: read-only
      prompt: |
        Be direct and specific. Challenge assumptions, list risks in priority order and propose fixes.
        You may delegate focused work to your own team with the `delegate` tool (from = "chloe").
    departments: []

  - id: antigravity
    runtime: antigravity
    mode: manual
    label: { en: "Antigravity", ja: "Antigravity" }
    color: "#4ade80"
    departments: []
